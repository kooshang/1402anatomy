<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A student blog about anatomy topics including skeletal, muscular, and nervous systems.">
    <meta name="author" content="Your Name">
    <title>Anatomy Insights - Student Weblog</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-900">
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold">Anatomy Insights</h1>
            <input id="searchInput" type="text" placeholder="Search posts..." class="border p-2 rounded w-1/2">
            <button id="createPostBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">New Post</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-4">
            <label class="block font-medium mb-2">Filter by Tag:</label>
            <select id="tagFilter" class="border p-2 rounded">
                <option value="all">All</option>
                <option value="skeletal">Skeletal</option>
                <option value="muscular">Muscular</option>
                <option value="nervous">Nervous</option>
            </select>
        </div>

        <div id="postsContainer" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <!-- Posts dynamically inserted here -->
        </div>

        <p id="noPostsMessage" class="text-center text-gray-500 hidden">No posts found.</p>
    </main>

    <!-- Modal -->
    <div id="postModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded shadow max-w-md w-full relative">
            <button id="closeModalBtn" class="absolute top-2 right-2 text-gray-500 hover:text-red-600" aria-label="Close">&times;</button>
            <h2 class="text-lg font-bold mb-4">Create a New Post</h2>
            <input id="postTitle" type="text" placeholder="Title" class="w-full mb-2 border p-2 rounded">
            <textarea id="postContent" rows="4" placeholder="Content" class="w-full mb-2 border p-2 rounded"></textarea>
            <select id="postTag" class="w-full mb-2 border p-2 rounded">
                <option value="skeletal">Skeletal</option>
                <option value="muscular">Muscular</option>
                <option value="nervous">Nervous</option>
            </select>
            <input id="postImage" type="file" accept="image/*" class="w-full mb-4 border p-2 rounded">
            <button id="savePostBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full">Save Post</button>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="relative">
            <img id="modalImage" class="max-h-screen max-w-screen rounded" alt="Zoomed Image">
            <a id="modalDownload" class="absolute bottom-4 right-4 bg-white text-blue-600 px-4 py-2 rounded shadow hover:bg-blue-100" download>Download</a>
        </div>
    </div>

    <script>
        const createPostBtn = document.getElementById('createPostBtn');
        const postModal = document.getElementById('postModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const savePostBtn = document.getElementById('savePostBtn');
        const postsContainer = document.getElementById('postsContainer');
        const postTitle = document.getElementById('postTitle');
        const postContent = document.getElementById('postContent');
        const postTag = document.getElementById('postTag');
        const postImage = document.getElementById('postImage');
        const tagFilter = document.getElementById('tagFilter');
        const searchInput = document.getElementById('searchInput');
        const noPostsMessage = document.getElementById('noPostsMessage');

        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalDownload = document.getElementById('modalDownload');

        let posts = JSON.parse(localStorage.getItem('posts')) || [];

        function savePosts() {
            localStorage.setItem('posts', JSON.stringify(posts));
        }

        function renderPosts() {
            postsContainer.innerHTML = '';
            const filter = tagFilter.value;
            const search = searchInput.value.toLowerCase();
            const filtered = posts.filter(p => (filter === 'all' || p.tag === filter) && p.title.toLowerCase().includes(search));

            if (filtered.length === 0) {
                noPostsMessage.classList.remove('hidden');
                return;
            } else {
                noPostsMessage.classList.add('hidden');
            }

            filtered.forEach((post, index) => {
                const postDiv = document.createElement('div');
                postDiv.className = 'bg-white rounded shadow p-4';
                postDiv.innerHTML = `
                    <img src="${post.image}" alt="Post Image" class="mb-2 w-full h-48 object-cover rounded cursor-pointer">
                    <h3 class="font-bold text-lg mb-1">${post.title}</h3>
                    <p class="mb-2">${post.content}</p>
                    <span class="text-sm px-2 py-1 bg-gray-200 rounded">${post.tag}</span>
                    <button data-index="${index}" class="deleteBtn mt-2 text-red-500 hover:underline">Delete</button>
                    <div class="mt-4">
                        <h4 class="font-medium mb-2">Comments:</h4>
                        <ul class="comments mb-2">
                            ${(post.comments || []).map(c => `<li class="text-sm border-b">${c}</li>`).join('')}
                        </ul>
                        <input type="text" placeholder="Add a comment..." class="commentInput border p-1 rounded w-full">
                        <button data-index="${index}" class="addCommentBtn mt-1 bg-blue-500 text-white px-2 py-1 rounded text-sm">Add Comment</button>
                    </div>
                `;

                const img = postDiv.querySelector('img');
                img.addEventListener('click', () => {
                    modalImage.src = post.image;
                    const fileExtension = post.image.substring("data:image/".length, post.image.indexOf(";"));
                    modalDownload.href = post.image;
                    modalDownload.download = `${post.title}.${fileExtension}`;
                    imageModal.classList.remove('hidden');
                });

                postsContainer.appendChild(postDiv);
            });

            document.querySelectorAll('.deleteBtn').forEach(btn => {
                btn.onclick = () => {
                    const idx = btn.getAttribute('data-index');
                    posts.splice(idx, 1);
                    savePosts();
                    renderPosts();
                };
            });

            document.querySelectorAll('.addCommentBtn').forEach(btn => {
                btn.onclick = () => {
                    const idx = btn.getAttribute('data-index');
                    const commentInput = btn.previousElementSibling;
                    const comment = commentInput.value.trim();
                    if (!comment) return;
                    posts[idx].comments = posts[idx].comments || [];
                    posts[idx].comments.push(comment);
                    savePosts();
                    renderPosts();
                };
            });
        }

        createPostBtn.onclick = () => postModal.classList.remove('hidden');
        closeModalBtn.onclick = () => postModal.classList.add('hidden');

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.add('hidden');
                modalImage.src = '';
            }
        });

        savePostBtn.onclick = () => {
            if (!postTitle.value.trim() || !postContent.value.trim() || !postImage.files[0]) {
                return alert('Please fill in all fields and select an image.');
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const newPost = {
                    title: postTitle.value.trim(),
                    content: postContent.value.trim(),
                    tag: postTag.value,
                    image: e.target.result,
                    comments: []
                };
                posts.unshift(newPost);
                savePosts();
                renderPosts();
                postModal.classList.add('hidden');
                postTitle.value = postContent.value = '';
                postImage.value = '';
            };
            reader.readAsDataURL(postImage.files[0]);
        };

        tagFilter.onchange = renderPosts;
        searchInput.oninput = renderPosts;

        renderPosts();
    </script>
</body>

</html>
